<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 58 424 424">
  <defs>
    <linearGradient id="kartu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA24A"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="dompet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#E9EAED" stop-opacity=".98"/>
    </linearGradient>
    <radialGradient id="cahaya" cx="0.34" cy="0.30" r="0.72">
      <stop offset="0" stop-color="#FF7A00"/>
      <stop offset="0.38" stop-color="#FF8A1F" stop-opacity=".92"/>
      <stop offset="0.72" stop-color="#FFB774" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#121212" flood-opacity=".22"/>
    </filter>
  </defs>
  <!-- kartu di belakang -->
  <path d="M96 196 C96 160 118 140 152 134 L352 98 C388 92 410 108 416 142 L434 238 L104 280 Z" fill="url(#kartu)"/>
  <!-- badan dompet -->
  <g filter="url(#bayang)">
    <rect x="56" y="178" width="400" height="262" rx="70" fill="url(#dompet)"/>
    <rect x="56" y="178" width="400" height="262" rx="70" fill="url(#cahaya)"/>
  </g>
  <!-- kancing -->
  <circle cx="404" cy="309" r="22" fill="#B9BBC0"/>
  <circle cx="404" cy="305" r="22" fill="#C9CBD0"/>
  <!-- tulisan -->
  <text x="88" y="330" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="#FFFFFF">KenTal</text>
</svg>
